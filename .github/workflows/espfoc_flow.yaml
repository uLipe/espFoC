name: Build
on: push
jobs:
  unit_tests:
    name: Unit tests (linux host run, esp32c6 compile check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.8'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bison ccache flex gcc git gperf libffi-dev libncurses-dev libssl-dev make wget libbsd-dev

    - name: Checkout ESP-IDF
      uses: actions/checkout@v4
      with:
        repository: espressif/esp-idf
        path: idf
        submodules: recursive
        ref: release/v5.5

    - name: Install ESP-IDF
      run: |
        ./idf/install.sh --enable-ci

    # Suites that need the inverter, the rotor driver or the stacks' tasks are
    # integration tests: they are left out of the host build and run on silicon.
    - name: Run unit tests on the linux host
      env:
        # The component manifest lists chip targets only.
        IDF_COMPONENT_MANAGER: '0'
      run: |
        . ./idf/export.sh
        cd examples/unit_test_runner
        idf.py --preview -B build_host -D SDKCONFIG=build_host/sdkconfig \
          -D TEST_COMPONENTS=espFoC set-target linux build
        ./build_host/espfoc_unit_test_runner.elf

    - name: Build unit test runner (esp32c6 compile check)
      run: |
        . ./idf/export.sh
        cd examples/unit_test_runner
        idf.py set-target esp32c6
        idf.py -D TEST_COMPONENTS=espFoC build

  examples:
    name: Build examples (esp32c6)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        example: [foc_sensored_torque, foc_sensored_velocity, foc_sensored_servo,
                  foc_sensorless_torque, foc_sensorless_velocity]
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.8'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bison ccache flex gcc git gperf libffi-dev libncurses-dev libssl-dev make wget

    - name: Checkout ESP-IDF
      uses: actions/checkout@v4
      with:
        repository: espressif/esp-idf
        path: idf
        submodules: recursive
        ref: release/v5.5

    - name: Install ESP-IDF
      run: |
        ./idf/install.sh esp32c6

    - name: Build ${{ matrix.example }}
      run: |
        . ./idf/export.sh
        cd examples/${{ matrix.example }}
        idf.py build
